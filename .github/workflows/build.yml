name: build
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - run: |
          set -o pipefail
          gradle assembleRelease --console=plain 2>&1 | tee build.log
      - if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          grep -iE "error|warning:|e: |What went wrong" -A3 build.log | head -150 > errors.txt || true
          tail -60 build.log >> errors.txt
          gh release delete buildlog -y --cleanup-tag || true
          gh release create buildlog errors.txt -t buildlog -n "build failure log" --prerelease
      - run: cp app/build/outputs/apk/release/app-release.apk PhysicsHome.apk
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest PhysicsHome.apk -t "물리 홈" -n "폰에서 PhysicsHome.apk 를 눌러 설치하세요"
