name: build
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - run: gradle assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk PhysicsLauncher.apk
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest PhysicsLauncher.apk -t "물리 런처" -n "폰에서 PhysicsLauncher.apk 를 눌러 설치하세요"
