plugins { id 'com.android.application' }
android {
    namespace 'com.physics.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.physics.launcher'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        rel { storeFile file('key.jks'); storePassword 'physics'; keyAlias 'k'; keyPassword 'physics' }
    }
    buildTypes { release { signingConfig signingConfigs.rel; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
